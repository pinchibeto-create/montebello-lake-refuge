name: Actualizar WhatsApp Cinco Lagos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-whatsapp-cinco-lagos.yml'

permissions:
  contents: write

jobs:
  update-phone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Actualizar teléfono, enlaces y QR
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          replacements = {
              'src/lib/site.ts': [
                  ('529612559561', '525638844112'),
                  ('961 255 9561', '56 3884 4112'),
              ],
              'src/routes/index.tsx': [
                  ('+52 961 255 9561', '+52 56 3884 4112'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          qr_b64 = ''
          Path('public/images/general/qr-disponibilidad.png').write_bytes(base64.b64decode(qr_b64))
          PY

          git diff --check
          git diff -- src/lib/site.ts src/routes/index.tsx

      - name: Commit y push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/site.ts src/routes/index.tsx public/images/general/qr-disponibilidad.png
          git commit -m "fix: actualizar WhatsApp de Cinco Lagos a 56 3884 4112"
          git push
